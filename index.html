/* ============================================================
   ANALYSE — sessiedata van OpenF1 (gratis vanaf ~30 min na afloop)
   Ruwe data wordt NIET bewaard (een race is ~550 kB); we rekenen
   er meteen een compacte samenvatting uit en bewaren alleen die.
   ============================================================ */
const OF1 = 'https://api.openf1.org/v1';

async function of1(pad){
  const r = await fetch(OF1 + pad);
  if(r.status === 404) return [];
  if(!r.ok) throw new Error('OpenF1 ' + r.status);
  return r.json();
}
const rustig = () => new Promise(r => setTimeout(r, 350));   // binnen 3 verzoeken/sec blijven

// alle sessies van het seizoen (klein, 6 uur cachen)
async function of1Sessions(season){
  const d = await cachedJSON(`${OF1}/sessions?year=${season}`, 6*HOUR);
  return Array.isArray(d) ? d : [];
}

// welke OpenF1-sessies horen bij onze ronde? (matchen op datum)
function sessionsVoorRonde(alle, race){
  const dag = 24*HOUR;
  return alle
    .filter(s => Math.abs(new Date(s.date_start) - race.raceStart) < 4*dag)
    .filter(s => ['Race','Qualifying','Sprint','Sprint Qualifying'].includes(s.session_name))
    .sort((a,b) => new Date(a.date_start) - new Date(b.date_start));
}

// bij een kwalificatie zijn duration en gap_to_leader lijsten [Q1,Q2,Q3] → neem de laatste echte waarde
const laatsteWaarde = v => Array.isArray(v) ? (v.filter(x => x != null && x !== '').pop() ?? null) : v;

const secToTijd = s => {
  if(s == null) return '—';
  const u = Math.floor(s/3600);
  const m = Math.floor((s - u*3600)/60);
  const rest = (s - u*3600 - m*60).toFixed(3).padStart(6,'0');
  if(u) return `${u}:${String(m).padStart(2,'0')}:${rest}`;
  return m ? `${m}:${rest}` : rest;
};

async function bouwAnalyse(sessionKey){
  const cache = lsGet('an2:'+sessionKey);
  if(cache) return cache;

  const drivers = await of1(`/drivers?session_key=${sessionKey}`);            await rustig();
  const result  = await of1(`/session_result?session_key=${sessionKey}`);     await rustig();
  const laps    = await of1(`/laps?session_key=${sessionKey}`);               await rustig();
  const stints  = await of1(`/stints?session_key=${sessionKey}`);             await rustig();
  const pits    = await of1(`/pit?session_key=${sessionKey}`);                await rustig();
  let posities  = [];
  try{ posities = await of1(`/position?session_key=${sessionKey}`); }catch(e){}

  const dMap = {};
  for(const d of drivers){
    dMap[d.driver_number] = {
      num: d.driver_number,
      code: d.name_acronym || String(d.driver_number),
      naam: d.full_name || d.broadcast_name || ('#'+d.driver_number),
      team: d.team_name || '',
      kleur: d.team_colour ? '#'+d.team_colour : '#5c5c6c',
    };
  }

  // per coureur: beste ronde, gemiddelde, topsnelheid
  const per = {};
  let snelste = null;
  for(const l of laps){
    if(l.lap_duration == null || l.is_pit_out_lap) continue;
    const p = per[l.driver_number] || (per[l.driver_number] = {beste:null, besteLap:null, som:0, n:0, top:0});
    if(p.beste == null || l.lap_duration < p.beste){ p.beste = l.lap_duration; p.besteLap = l.lap_number; }
    p.som += l.lap_duration; p.n++;
    if(l.st_speed && l.st_speed > p.top) p.top = l.st_speed;
    if(!snelste || l.lap_duration < snelste.tijd) snelste = {num:l.driver_number, tijd:l.lap_duration, lap:l.lap_number};
  }
  for(const k in per) per[k].gem = per[k].n ? per[k].som/per[k].n : null;

  // positieverloop per ronde (afgeleid uit de positie-tijdlijn)
  const maxLap = laps.reduce((m,l) => Math.max(m, l.lap_number||0), 0);
  const lapTijd = {};                        // ronde → starttijd van de leider
  for(const l of laps){
    if(!l.date_start) continue;
    const t = new Date(l.date_start).getTime();
    if(!lapTijd[l.lap_number] || t < lapTijd[l.lap_number]) lapTijd[l.lap_number] = t;
  }
  const perCoureurPos = {};
  for(const p of posities){
    (perCoureurPos[p.driver_number] || (perCoureurPos[p.driver_number] = []))
      .push({t:new Date(p.date).getTime(), pos:p.position});
  }
  for(const k in perCoureurPos) perCoureurPos[k].sort((a,b)=>a.t-b.t);
  const verloop = [];
  for(let lap = 1; lap <= maxLap; lap++){
    const t = lapTijd[lap]; if(!t) continue;
    const rij = {lap, pos:{}};
    for(const k in perCoureurPos){
      let laatste = null;
      for(const rec of perCoureurPos[k]){ if(rec.t <= t) laatste = rec.pos; else break; }
      if(laatste != null) rij.pos[k] = laatste;
    }
    verloop.push(rij);
  }

  const klassement = (result||[]).sort((a,b)=>(a.position??99)-(b.position??99)).map(r => ({
    pos: r.position, num: r.driver_number, laps: r.number_of_laps,
    punten: r.points, dnf: !!r.dnf, dns: !!r.dns, dsq: !!r.dsq,
    duur: laatsteWaarde(r.duration), gap: laatsteWaarde(r.gap_to_leader),
  }));

  const samenvatting = {
    sessionKey, gemaakt: Date.now(), coureurs: dMap, klassement, per, snelste,
    stints: (stints||[]).map(s => ({num:s.driver_number, van:s.lap_start, tot:s.lap_end, band:s.compound, leeftijd:s.tyre_age_at_start})),
    pits: (pits||[]).map(p => ({num:p.driver_number, lap:p.lap_number, duur:p.pit_duration})),
    verloop, maxLap,
  };
  // alleen de laatste 6 sessies bewaren (localStorage is klein)
  const bewaard = (lsGet('an2:index') || []).filter(k => k !== sessionKey);
  bewaard.push(sessionKey);
  while(bewaard.length > 6){ try{ localStorage.removeItem(LS+'an2:'+bewaard.shift()); }catch(e){} }
  lsSet('an2:index', bewaard);
  lsSet('an2:'+sessionKey, samenvatting);
  return samenvatting;
}

/* ---------- Analyse: weergave ---------- */
const BAND_KLEUR = { SOFT:'#e10600', MEDIUM:'#f5c518', HARD:'#e6e6e6',
                     INTERMEDIATE:'#2fd06f', WET:'#4aa3ff', UNKNOWN:'#5c5c6c' };

function setAnalyseSessie(key, naam){
  S.anKey = key; S.anNaam = naam; lsSet('anKey', key);
  S.anData = null; S.anFout = null; renderAnalyse();
  bouwAnalyse(key)
    .then(d => { S.anData = d; renderAnalyse(); })
    .catch(e => { S.anFout = e.message; renderAnalyse(); });
}

function renderAnalyse(){
  const el = $('#view-analyse');
  const lijst = S.anSessies || [];
  let html = '';

  if(!lijst.length){
    el.innerHTML = `<div class="card"><h2>Analyse</h2>
      <p class="muted small">Nog geen sessiedata beschikbaar. Die verschijnt ongeveer een half uur
      na afloop van elke sessie — dan staat hier de volledige ontleding van kwalificatie en race.</p></div>`;
    return;
  }

  html += `<div class="tabs-inline" style="flex-wrap:wrap">${lijst.map(s =>
    `<button class="tab-btn ${S.anKey===s.session_key?'active':''}" style="flex:1 1 45%"
      onclick="setAnalyseSessie(${s.session_key}, '${esc(s.session_name)}')">
      ${esc(s.session_name === 'Qualifying' ? 'Kwalificatie' : s.session_name)}</button>`).join('')}</div>`;

  if(S.anFout){
    html += `<div class="card"><h2>Even niet beschikbaar</h2>
      <p class="muted small">${esc(S.anFout)}. Tijdens een sessie en tot een half uur erna houdt
      OpenF1 de data achter een abonnement; daarna is alles gratis. Probeer het later nog eens.</p></div>`;
    el.innerHTML = html; return;
  }
  if(!S.anKey){ html += `<div class="card"><p class="muted small">Kies hierboven een sessie.</p></div>`; el.innerHTML = html; return; }
  if(!S.anData){ html += `<div class="loading">Sessiedata ophalen…</div>`; el.innerHTML = html; return; }

  const d = S.anData, C = d.coureurs;
  const naam = n => C[n] ? C[n].code : '#'+n;
  const kleur = n => C[n] ? C[n].kleur : '#5c5c6c';

  // welke coureurs staan in mijn voorspelling? (die lichten we uit)
  const nr = nextRace() || lastDoneRace();
  const mijn = (S.me && nr) ? (predOf(nr.round, S.me) || {}) : {};
  const mijnIds = ['q1','q2','q3','p1','p2','p3','fl'].map(k => mijn[k]).filter(Boolean);
  const mijnNums = new Set(S.drivers.filter(x => mijnIds.includes(x.id))
    .map(x => parseInt(x.num,10)).filter(Boolean));

  // --- snelste ronde ---
  if(d.snelste){
    html += `<div class="card"><div class="checker"></div><h2>Snelste ronde</h2>
      <div style="display:flex;align-items:center;gap:12px">
        <span style="font-size:26px">⚡</span>
        <div style="flex:1"><b style="font-size:17px">${esc(C[d.snelste.num]?.naam || naam(d.snelste.num))}</b>
          <div class="small muted">${esc(C[d.snelste.num]?.team||'')} · ronde ${d.snelste.lap}</div></div>
        <span style="font-family:var(--mono);font-size:19px;color:var(--gold)">${secToTijd(d.snelste.tijd)}</span>
      </div></div>`;
  }

  // --- klassement ---
  if(d.klassement.length){
    html += `<div class="card"><h2>Uitslag</h2>`;
    html += d.klassement.map(r => {
      const p = d.per[r.num] || {};
      const status = r.dnf ? 'DNF' : r.dsq ? 'DSQ' : r.dns ? 'DNS' : null;
      const rechts = status ? status
        : (r.pos === 1 ? secToTijd(r.duur)
           : (r.gap != null && r.gap !== '' ? '+'+(isNaN(+r.gap) ? r.gap : (+r.gap).toFixed(3)) : '—'));
      return `<div class="res-row" ${mijnNums.has(r.num)?'style="background:rgba(245,197,24,.07);border-radius:8px"':''}>
        <span class="pos">${r.pos ?? '–'}</span>
        <span class="teambar" style="background:${kleur(r.num)}"></span>
        <span class="d-name">${esc(C[r.num]?.naam || naam(r.num))}
          <span class="d-team">${esc(C[r.num]?.team||'')}${p.beste ? ' · beste '+secToTijd(p.beste) : ''}${p.top ? ' · '+p.top+' km/u' : ''}</span></span>
        <span class="d-right" ${status?'style="color:var(--red2)"':''}>${esc(String(rechts)).slice(0,11)}</span>
      </div>`;
    }).join('');
    html += `</div>`;
  }

  // --- bandenstints ---
  if(d.stints.length && d.maxLap){
    const perC = {};
    for(const s of d.stints) (perC[s.num] || (perC[s.num]=[])).push(s);
    const volgorde = d.klassement.length ? d.klassement.map(r=>r.num) : Object.keys(perC).map(Number);
    html += `<div class="card"><h2>Bandenstrategie</h2>
      <div style="display:flex;flex-direction:column;gap:5px">`;
    for(const num of volgorde){
      const st = perC[num]; if(!st) continue;
      html += `<div style="display:flex;align-items:center;gap:8px">
        <span style="width:34px;font-family:var(--mono);font-size:11px;color:var(--dim)">${esc(naam(num))}</span>
        <span style="flex:1;display:flex;gap:2px;height:14px">${st.map(s => {
          const breedte = Math.max(1, ((s.tot - s.van + 1) / d.maxLap) * 100);
          const c = BAND_KLEUR[s.band] || BAND_KLEUR.UNKNOWN;
          return `<span title="${esc(s.band||'?')} ronde ${s.van}-${s.tot}"
            style="width:${breedte}%;background:${c};border-radius:3px;opacity:.85"></span>`;
        }).join('')}</span></div>`;
    }
    html += `</div><div class="pts-chips" style="margin-top:10px">${
      Object.entries(BAND_KLEUR).filter(([k])=>k!=='UNKNOWN').map(([k,c]) =>
      `<span class="pchip"><span style="width:9px;height:9px;border-radius:50%;background:${c};display:inline-block"></span>${k}</span>`).join('')
    }</div></div>`;
  }

  // --- positieverloop ---
  if(d.verloop.length > 2){
    const W = 320, H = 210, mL = 26, mR = 8, mT = 8, mB = 18;
    const nPos = Math.max(...d.verloop.flatMap(v => Object.values(v.pos)), 1);
    const x = lap => mL + ((lap-1)/(d.maxLap-1||1)) * (W-mL-mR);
    const y = pos => mT + ((pos-1)/(nPos-1||1)) * (H-mT-mB);
    const nums = [...new Set(d.verloop.flatMap(v => Object.keys(v.pos)))];
    const lijnen = nums.map(n => {
      const punten = d.verloop.filter(v => v.pos[n]).map(v => `${x(v.lap).toFixed(1)},${y(v.pos[n]).toFixed(1)}`);
      if(punten.length < 2) return '';
      const uit = mijnNums.has(+n);
      return `<polyline points="${punten.join(' ')}" fill="none" stroke="${kleur(+n)}"
        stroke-width="${uit?2.4:1}" opacity="${uit?1:.45}" stroke-linejoin="round"/>`;
    }).join('');
    html += `<div class="card"><h2>Positieverloop</h2>
      <div class="matrix-wrap"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:300px">
        ${[1,5,10,15,20].filter(p=>p<=nPos).map(p =>
          `<line x1="${mL}" y1="${y(p)}" x2="${W-mR}" y2="${y(p)}" stroke="#23232f" stroke-width=".5"/>
           <text x="2" y="${y(p)+3}" fill="#5c5c6c" font-size="8" font-family="monospace">P${p}</text>`).join('')}
        ${lijnen}
        <text x="${mL}" y="${H-4}" fill="#5c5c6c" font-size="8" font-family="monospace">ronde 1</text>
        <text x="${W-mR}" y="${H-4}" fill="#5c5c6c" font-size="8" font-family="monospace" text-anchor="end">${d.maxLap}</text>
      </svg></div>
      ${mijnNums.size ? '<div class="small muted" style="margin-top:6px">Jouw voorspelde coureurs zijn uitgelicht.</div>' : ''}
    </div>`;
  }

  // --- pitstops ---
  if(d.pits.length){
    const gesorteerd = [...d.pits].filter(p=>p.duur).sort((a,b)=>a.duur-b.duur).slice(0,8);
    html += `<div class="card"><h2>Snelste pitstops</h2>${gesorteerd.map((p,i) => `
      <div class="res-row"><span class="pos">${i+1}</span>
        <span class="teambar" style="background:${kleur(p.num)}"></span>
        <span class="d-name">${esc(C[p.num]?.naam || naam(p.num))}<span class="d-team">ronde ${p.lap}</span></span>
        <span class="d-right">${p.duur.toFixed(1)}s</span></div>`).join('')}</div>`;
  }

  el.innerHTML = html;
}


// welke sessies van dit weekend zijn al gratis beschikbaar?
async function laadAnalyseSessies(){
  try{
    const nr = nextRace();
    const race = (nr && nr.sessions.length && Date.now() > nr.sessions[0].start.getTime()) ? nr : lastDoneRace();
    if(!race || !S.season) return;
    const alle = await of1Sessions(S.season);
    const lijst = sessionsVoorRonde(alle, race)
      .filter(s => new Date(s.date_end).getTime() < Date.now() - 30*MIN);   // buiten het betaalde venster
    S.anSessies = lijst;
    const bewaard = lsGet('anKey');
    const kies = lijst.find(s => s.session_key === bewaard) || lijst[lijst.length-1];
    if(kies && !S.anKey) setAnalyseSessie(kies.session_key, kies.session_name);
    else renderAnalyse();
  }catch(e){ console.warn('analyse-sessies niet geladen', e); }
}

/* ============================================================
   LIVE — timingtoren, jullie Cup live, baankaart, telemetrie
   Werkt met twee bronnen die dezelfde code delen:
     'live'   → OpenF1 met sponsorsleutel, tijd = nu
     'replay' → historische sessie, tijd = nagespeelde klok  (?replay=<session_key>)
   Valt bij een storing altijd stil zonder de rest van de app te raken.
   ============================================================ */
const L = {
  aan:false, bron:'live', sessionKey:null, sessie:null,
  coureurs:{}, pos:{}, iv:{}, band:{}, pits:{}, loc:{},
  meldingen:[], weer:null, ronde:null, maxRonde:null, beste:{}, laatste:{}, rondeVan:{},
  baan:null, kaartOpen:false, gekozen:null, tel:null,
  sinds:{}, klok:null, snelheid:1, timer:null, fout:null, laatsteUpdate:null,
};

function of1Headers(){
  return CONFIG.openf1Key ? { 'Authorization': 'Bearer ' + CONFIG.openf1Key } : {};
}
async function of1L(pad){
  const r = await fetch(OF1 + pad, { headers: of1Headers() });
  if(r.status === 404) return [];
  if(r.status === 401 || r.status === 403) throw new Error('geen toegang tot live data (sleutel?)');
  if(!r.ok) throw new Error('OpenF1 ' + r.status);
  return r.json();
}
const isoKort = d => new Date(d).toISOString().slice(0,19);

// verzoeken netjes achter elkaar, met tussenpozen — anders slaat de snelheidslimiet toe
let of1Rij = Promise.resolve();
function of1Q(pad){
  const p = of1Rij.then(async () => { await new Promise(r => setTimeout(r, 340)); return of1L(pad); });
  of1Rij = p.then(()=>{}, ()=>{});
  return p;
}

/* ---- baanvorm: één snelle ronde → omtrek, voor altijd bewaard ---- */
async function baanVorm(sessionKey, circuitKey){
  const sleutel = 'baan:' + (circuitKey || sessionKey);
  const cache = lsGet(sleutel);
  if(cache) return cache;
  const laps = await of1L(`/laps?session_key=${sessionKey}`);
  const geldig = laps.filter(l => l.lap_duration && l.date_start);
  if(!geldig.length) return null;
  const beste = geldig.sort((a,b) => a.lap_duration - b.lap_duration)[0];
  const t0 = new Date(beste.date_start), t1 = new Date(t0.getTime() + beste.lap_duration*1000);
  const loc = await of1L(`/location?session_key=${sessionKey}&driver_number=${beste.driver_number}&date>=${isoKort(t0)}&date<${isoKort(t1)}`);
  const pts = loc.filter(p => p.x || p.y).map(p => [p.x, p.y]);
  if(pts.length < 40) return null;
  const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
  const vorm = { pts, minX:Math.min(...xs), maxX:Math.max(...xs), minY:Math.min(...ys), maxY:Math.max(...ys) };
  lsSet(sleutel, vorm);
  return vorm;
}

/* ---- welke sessie loopt er nu? ---- */
async function liveSessieNu(){
  const alle = await of1Sessions(S.season);
  const nu = Date.now();
  return alle.find(s => {
    const a = new Date(s.date_start).getTime() - 30*MIN;
    const b = new Date(s.date_end).getTime() + 10*MIN;
    return nu >= a && nu <= b;
  }) || null;
}

/* ---- één ronde data ophalen voor tijdstip T ---- */
async function liveTik(){
  try{
    const T = L.bron === 'replay' ? L.klok : new Date();
    const K = L.sessionKey;
    const na = sleutel => L.sinds[sleutel] ? `&date>${isoKort(L.sinds[sleutel])}` : '';
    const tot = `&date<=${isoKort(T)}`;

    L.tikNr = (L.tikNr || 0) + 1;
    const traag = L.tikNr % 4 === 1;          // stints/pits/meldingen/weer elke 4e ronde

    const pos = await of1Q(`/position?session_key=${K}${na('pos')}${tot}`).catch(()=>[]);
    const iv  = await of1Q(`/intervals?session_key=${K}${na('iv')}${tot}`).catch(()=>[]);
    const lp  = await of1Q(`/laps?session_key=${K}${L.sinds.lp ? `&date_start>${isoKort(L.sinds.lp)}` : ''}`).catch(()=>[]);
    const st  = traag ? await of1Q(`/stints?session_key=${K}`).catch(()=>[]) : [];
    const pit = traag ? await of1Q(`/pit?session_key=${K}`).catch(()=>[]) : [];
    const rc  = traag ? await of1Q(`/race_control?session_key=${K}${na('rc')}${tot}`).catch(()=>[]) : [];
    const we  = traag ? await of1Q(`/weather?session_key=${K}${na('we')}${tot}`).catch(()=>[]) : [];

    for(const p of pos){ L.pos[p.driver_number] = p.position; L.sinds.pos = p.date; }
    for(const i of iv){ L.iv[i.driver_number] = {gap:i.gap_to_leader, iv:i.interval}; L.sinds.iv = i.date; }
    for(const s of st){
      const b = L.band[s.driver_number];
      if(!b || s.stint_number >= b.nr) L.band[s.driver_number] = {nr:s.stint_number, band:s.compound, van:s.lap_start, leeftijd:s.tyre_age_at_start};
    }
    if(pit.length){
      const telling = {};
      for(const p of pit) telling[p.driver_number] = (telling[p.driver_number]||0) + 1;
      L.pits = telling;
    }
    for(const l of lp){
      if(l.date_start) L.sinds.lp = l.date_start;
      if(l.lap_number) L.rondeVan[l.driver_number] = Math.max(L.rondeVan[l.driver_number]||0, l.lap_number);
      if(l.lap_duration == null || l.is_pit_out_lap) continue;
      L.laatste[l.driver_number] = l.lap_duration;
      if(L.beste[l.driver_number] == null || l.lap_duration < L.beste[l.driver_number])
        L.beste[l.driver_number] = l.lap_duration;
    }
    for(const m of rc){
      L.meldingen.unshift(m); L.sinds.rc = m.date;
      if(m.lap_number) L.ronde = Math.max(L.ronde||0, m.lap_number);
    }
    L.meldingen = L.meldingen.slice(0, 8);
    if(we.length){ L.weer = we[we.length-1]; L.sinds.we = we[we.length-1].date; }

    const rondes = Object.values(L.rondeVan);
    if(rondes.length) L.ronde = Math.max(L.ronde||0, ...rondes);

    if(L.kaartOpen) await liveKaartTik(T);
    if(L.gekozen) await liveTelemetrieTik(T);

    L.fout = null; L.laatsteUpdate = Date.now();
  }catch(e){
    L.fout = e.message;
  }
  if(S.view === 'live') renderLive();
}

async function laadBaan(){
  if(L.baan || L.baanBezig) return;
  L.baanBezig = true;
  try{
    L.baan = await baanVorm(L.sessionKey, L.sessie && L.sessie.circuit_key);
  }catch(e){ /* volgende tik opnieuw */ }
  L.baanBezig = false;
  if(S.view === 'live') renderLive();
}

async function liveKaartTik(T){
  if(!L.baan){ await laadBaan(); }
  const venster = L.bron === 'replay' ? Math.max(2500, 1200 * L.snelheid) : 2500;
  const a = new Date(new Date(T).getTime() - venster);
  const loc = await of1Q(`/location?session_key=${L.sessionKey}&date>=${isoKort(a)}&date<=${isoKort(T)}`).catch(()=>[]);
  for(const p of loc) if(p.x || p.y) L.loc[p.driver_number] = {x:p.x, y:p.y};
}
async function liveTelemetrieTik(T){
  const vensterT = L.bron === 'replay' ? Math.max(3000, 1200 * L.snelheid) : 3000;
  const a = new Date(new Date(T).getTime() - vensterT);
  const cd = await of1Q(`/car_data?session_key=${L.sessionKey}&driver_number=${L.gekozen}&date>=${isoKort(a)}&date<=${isoKort(T)}`).catch(()=>[]);
  if(cd.length) L.tel = cd[cd.length-1];
}

/* ---- starten / stoppen ---- */
async function liveStart(sessionKey, bron, startTijd){
  L.aan = true; L.bron = bron || 'live'; L.sessionKey = sessionKey;
  L.pos={}; L.iv={}; L.band={}; L.pits={}; L.loc={}; L.meldingen=[]; L.sinds={}; L.ronde=null;
  L.beste={}; L.laatste={}; L.rondeVan={};
  const alle = await of1Sessions(S.season).catch(()=>[]);
  L.sessie = alle.find(s => s.session_key === sessionKey) || null;
  if(L.bron === 'replay'){
    L.klok = new Date(startTijd || (L.sessie ? L.sessie.date_start : Date.now()));
    const p = new URLSearchParams(location.search);
    L.snelheid = parseInt(p.get('snelheid'), 10) || 6;   // standaard: 6× echte tijd
    L.eind = L.sessie ? new Date(L.sessie.date_end).getTime() : null;
  }
  L.coureurs = {};
  for(const d of await of1L(`/drivers?session_key=${sessionKey}`).catch(()=>[])){
    L.coureurs[d.driver_number] = { num:d.driver_number, code:d.name_acronym || ('#'+d.driver_number),
      naam:d.full_name || d.broadcast_name || '', team:d.team_name || '',
      kleur: d.team_colour ? '#'+d.team_colour : '#5c5c6c' };
  }
  clearInterval(L.timer);
  L.timer = setInterval(() => {
    if(L.bron === 'replay'){
      const volgende = L.klok.getTime() + 5000 * L.snelheid;
      L.klok = new Date(L.eind ? Math.min(volgende, L.eind) : volgende);
    }
    liveTik();
  }, 5000);
  liveTik();
  renderLive();
}
function liveStop(){ L.aan=false; clearInterval(L.timer); L.timer=null; }
function liveKaartToggle(){ L.kaartOpen = !L.kaartOpen; renderLive(); if(L.kaartOpen){ laadBaan(); liveTik(); } }
function liveKiesCoureur(num){ L.gekozen = (L.gekozen === num ? null : num); L.tel = null; renderLive(); if(L.gekozen) liveTik(); }

/* ---- voorlopige punten: hoe staan jullie ervoor als het NU zo eindigt? ---- */
function voorlopigePunten(){
  const nr = nextRace(); if(!nr) return [];
  const top3 = [1,2,3].map(p => {
    const e = Object.entries(L.pos).find(([,v]) => v === p);
    return e ? {pos:p, num:+e[0]} : null;
  }).filter(Boolean);
  if(top3.length < 3) return [];
  // OpenF1-nummer → onze coureur-id
  const naarId = num => {
    const c = L.coureurs[num]; if(!c) return null;
    const d = S.drivers.find(x => String(x.num) === String(num))
           || S.drivers.find(x => (x.code||'').toUpperCase() === (c.code||'').toUpperCase());
    return d ? d.id : null;
  };
  const rows = top3.map(t => ({pos:t.pos, driverId:naarId(t.num)})).filter(r => r.driverId);
  if(rows.length < 3) return [];
  return CONFIG.players.map(p => {
    const pr = predOf(nr.round, p.id);
    if(!pr) return {speler:p, punten:0, geen:true};
    const sc = scoreRound(pr, {rows, fl:null}, null);
    return {speler:p, punten:sc.race, hits:sc.hits, joker:!!pr.joker};
  }).sort((a,b) => b.punten - a.punten);
}

/* ---- Live: weergave ---- */
const VLAG_KLEUR = { GREEN:'#2fd06f', YELLOW:'#f5c518', DOUBLE_YELLOW:'#f5c518', RED:'#e10600',
                     CHEQUERED:'#fff', BLUE:'#4aa3ff', CLEAR:'#2fd06f' };

function isRaceSessie(){
  const n = L.sessie && L.sessie.session_name;
  return n === 'Race' || n === 'Sprint';
}

function renderLive(){
  const el = $('#view-live'); if(!el) return;
  if(!L.aan){
    el.innerHTML = `<div class="card"><h2>Live</h2>
      <p class="muted small">Er loopt nu geen sessie. Dit tabblad verschijnt vanzelf vanaf een half uur
      voor de start van een training, kwalificatie of race.</p></div>`;
    return;
  }
  const C = L.coureurs;
  const kleur = n => C[n] ? C[n].kleur : '#5c5c6c';
  const code  = n => C[n] ? C[n].code : '#'+n;
  let html = '';

  // --- statusbalk ---
  const vlagMelding = L.meldingen.find(m => m.flag && m.flag !== 'CLEAR');
  const sc = L.meldingen.find(m => /SAFETY CAR|VIRTUAL/i.test(m.message||''));
  html += `<div class="livebar">
    <span class="live-pill">● ${esc(L.bron === 'replay' ? 'HERHALING' : 'LIVE')}</span>
    <span class="lb-mid">${esc(L.sessie ? (L.sessie.session_name==='Qualifying'?'Kwalificatie':L.sessie.session_name) : '')}
      ${L.ronde ? `· ronde ${L.ronde}` : ''}</span>
    ${vlagMelding ? `<span class="lb-vlag" style="background:${VLAG_KLEUR[vlagMelding.flag]||'#5c5c6c'}">${esc(vlagMelding.flag)}</span>` : ''}
    ${L.weer ? `<span class="lb-weer">${L.weer.rainfall ? '🌧️' : '☀️'} ${Math.round(L.weer.track_temperature)}°</span>` : ''}
  </div>`;
  if(sc) html += `<div class="card" style="border-color:var(--gold);background:rgba(245,197,24,.1);padding:10px 14px">
    <b style="font-size:13px">⚠️ ${esc(sc.message)}</b></div>`;
  if(L.fout) html += `<div class="banner">⚠ ${esc(L.fout)} — de rest van de app werkt gewoon door.</div>`;

  // --- 1. timingtoren ---
  const opVolgorde = Object.entries(L.pos).map(([n,p]) => ({num:+n, pos:p}))
    .filter(x => x.pos).sort((a,b) => a.pos - b.pos);
  html += `<div class="card"><h2>Timing</h2>`;
  if(!opVolgorde.length){
    html += `<div class="loading">Wachten op de eerste data…</div>`;
  } else {
    html += `<div class="toren">` + opVolgorde.map(r => {
      const b = L.band[r.num], iv = L.iv[r.num] || {};
      const heeftGap = iv.iv != null && !isNaN(+iv.iv);
      const beste = L.beste[r.num], laatste = L.laatste[r.num];
      let gapTxt, totTxt;
      if(heeftGap){                                  // race: interval + gat tot leider
        gapTxt = r.pos === 1 ? 'LEIDER' : '+' + (+iv.iv).toFixed(3);
        totTxt = r.pos === 1 ? (laatste ? secToTijd(laatste) : '')
               : (iv.gap != null && !isNaN(+iv.gap) ? '+' + (+iv.gap).toFixed(1) : '');
      } else {                                        // kwali/training: beste ronde
        gapTxt = beste ? secToTijd(beste) : '—';
        totTxt = laatste && beste && laatste !== beste ? 'laatst ' + secToTijd(laatste) : '';
      }
      const bandLeeftijd = b && b.leeftijd != null && L.rondeVan[r.num]
        ? b.leeftijd + Math.max(0, L.rondeVan[r.num] - (b.van||1)) : null;
      return `<button class="tr-row ${L.gekozen===r.num?'open':''}" onclick="liveKiesCoureur(${r.num})">
        <span class="tr-pos">${r.pos}</span>
        <span class="teambar" style="background:${kleur(r.num)}"></span>
        <span class="tr-code">${esc(code(r.num))}</span>
        <span class="tr-band">${b ? `<span class="band-dot" style="background:${BAND_KLEUR[b.band]||BAND_KLEUR.UNKNOWN}"></span>${bandLeeftijd ? bandLeeftijd : ''}` : ''}</span>
        <span class="tr-pit">${isRaceSessie() && L.pits[r.num] ? 'P'+L.pits[r.num] : ''}</span>
        <span class="tr-gap">${esc(gapTxt)}<span class="tr-tot">${esc(totTxt)}</span></span>
      </button>` + (L.gekozen === r.num ? telemetrieBlok(r.num) : '');
    }).join('') + `</div>`;
  }
  html += `</div>`;

  // --- 2. jullie Cup live ---
  const vp = isRaceSessie() ? voorlopigePunten() : [];
  if(vp.length){
    html += `<div class="card"><div class="checker"></div><h2>${esc(CONFIG.cupName)} · als het nu zo eindigt</h2>`;
    html += vp.map((r,i) => `<div class="cup-row ${i===0?'first':''}" style="padding:9px 0">
      <span class="cup-rank">${i===0?'👑':i+1}</span>
      <span class="cup-em">${r.speler.emoji}</span>
      <div class="cup-main"><div class="cup-name" style="font-size:15px">${esc(r.speler.name)}
        ${r.joker?'<span style="font-size:12px">🃏</span>':''}</div>
        <div class="cup-sub">${r.geen ? 'niet voorspeld' : Object.values(r.hits||{}).filter(h=>h==='exact').length+' exact'}</div></div>
      <div class="cup-pts" style="font-size:18px">${r.punten}<span> ptn</span></div>
    </div>`).join('');
    html += `<div class="small muted" style="margin-top:8px">Voorlopig — telt pas mee als de vlag valt.</div></div>`;
  }

  // --- 3. baankaart (ingeklapt) ---
  html += `<div class="card"><button class="uitklap" onclick="liveKaartToggle()">
      <span style="flex:1;text-align:left">🗺️ Baankaart</span>
      <span class="muted small">${L.kaartOpen ? 'verbergen' : 'tonen'} ${L.kaartOpen?'▲':'▼'}</span></button>`;
  if(L.kaartOpen){
    if(!L.baan) html += `<div class="loading">Circuit tekenen…</div>`;
    else {
      const W=320,H=250,pad=16, v=L.baan;
      const sx = x => pad + (x - v.minX)/(v.maxX - v.minX)*(W-2*pad);
      const sy = y => H-pad - (y - v.minY)/(v.maxY - v.minY)*(H-2*pad);
      const d = 'M ' + v.pts.map(p => `${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)}`).join(' L ') + ' Z';
      const autos = Object.entries(L.loc).map(([n,p]) => {
        const pos = L.pos[n]; const uit = L.gekozen === +n;
        return `<circle cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="${uit?6:4.2}"
          fill="${kleur(+n)}" stroke="#0b0b10" stroke-width="1.2"/>
          ${uit||pos<=3 ? `<text x="${(sx(p.x)+7).toFixed(1)}" y="${(sy(p.y)+3).toFixed(1)}" fill="#fff" font-size="8" font-family="monospace">${esc(code(+n))}</text>` : ''}`;
      }).join('');
      html += `<svg viewBox="0 0 ${W} ${H}" style="width:100%;margin-top:10px">
        <path d="${d}" fill="none" stroke="#23232f" stroke-width="7" stroke-linejoin="round"/>
        <path d="${d}" fill="none" stroke="#3a3a4a" stroke-width="1.4" stroke-linejoin="round"/>
        ${autos}</svg>
        <div class="small muted">Ververst elke 5 seconden.</div>`;
    }
  }
  html += `</div>`;

  // --- 4. meldingen wedstrijdleiding ---
  if(L.meldingen.length){
    html += `<div class="card"><h2>Wedstrijdleiding</h2>${L.meldingen.slice(0,6).map(m => `
      <div class="melding">
        ${m.flag ? `<span class="m-vlag" style="background:${VLAG_KLEUR[m.flag]||'#5c5c6c'}"></span>` : '<span class="m-vlag" style="background:#3a3a4a"></span>'}
        <span class="m-txt">${esc(m.message||'')}</span>
        <span class="m-lap">${m.lap_number?('R'+m.lap_number):''}</span>
      </div>`).join('')}</div>`;
  }

  el.innerHTML = html;
}

function telemetrieBlok(num){
  const t = L.tel;
  if(!t) return `<div class="tel"><span class="loading" style="padding:6px">telemetrie laden…</span></div>`;
  const balk = (label, waarde, max, kleur) => `
    <div class="tel-rij"><span class="tel-lab">${label}</span>
      <span class="tel-baan"><span style="width:${Math.min(100, waarde/max*100)}%;background:${kleur}"></span></span>
      <span class="tel-w">${waarde}</span></div>`;
  return `<div class="tel">
    <div class="tel-top"><b style="font-size:20px;font-family:var(--mono)">${t.speed}</b><span class="muted small"> km/u</span>
      <span class="tel-chip">${t.n_gear ? 'V'+t.n_gear : '—'}</span>
      <span class="tel-chip" style="${t.drs>=10?'color:var(--green);border-color:var(--green)':''}">DRS</span>
      <span class="tel-chip">${Math.round(t.rpm/100)/10}k tpm</span></div>
    ${balk('gas', t.throttle, 100, 'var(--green)')}
    ${balk('rem', t.brake, 100, 'var(--red2)')}
  </div>`;
}


/* live-tabblad verschijnt alleen als er echt iets te zien is */
async function regelLive(){
  try{
    const knop = $('#nav-live'); if(!knop) return;
    const params = new URLSearchParams(location.search);
    const herhaling = params.get('replay');
    if(herhaling){                                   // testmodus: ?replay=<session_key>
      knop.style.display = '';
      if(!L.aan) await liveStart(parseInt(herhaling,10), 'replay', params.get('vanaf'));
      return;
    }
    const sessie = await liveSessieNu();
    if(sessie){
      knop.style.display = '';
      if(!L.aan || L.sessionKey !== sessie.session_key) await liveStart(sessie.session_key, 'live');
    } else {
      knop.style.display = 'none';
      if(L.aan){ liveStop(); if(S.view === 'live') setView('race'); }
    }
  }catch(e){ console.warn('live-check', e); }
}
